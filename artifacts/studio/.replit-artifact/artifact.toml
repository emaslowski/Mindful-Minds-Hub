kind = "web"
previewPath = "/studio/"
title = "Mind Matters Studio"
description = "The private student content creation and teacher review portal for Mind Matters. Students log in to research, draft, and submit wellness content; teachers review, approve, and publish submissions to the public site. Separate from the public-facing Mind Matters website."
version = "1.0.0"
id = "artifacts/studio"
router = "path"

[[services]]
name = "web"
paths = [ "/studio/" ]
localPort = 18425

[services.development]
run = "pnpm --filter @workspace/studio run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/studio", "run", "build" ]
serve = "static"
publicDir = "artifacts/studio/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18425"
BASE_PATH = "/studio/"
