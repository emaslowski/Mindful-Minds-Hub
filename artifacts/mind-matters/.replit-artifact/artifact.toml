kind = "web"
previewPath = "/"
title = "Mind Matters"
description = "A student-run mental wellness website for middle schoolers. Features six main sections — Learn, Create, Connect, Move, Listen, and Grow — with clickable subsections, a blog with student post submissions (emailed to admin for approval), art studio, cooking corner, exercise center, and strategy pages all matching the Mind Matters Canva design."
version = "1.0.0"
id = "artifacts/mind-matters"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23654

[services.development]
run = "pnpm --filter @workspace/mind-matters run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mind-matters", "run", "build" ]
serve = "static"
publicDir = "artifacts/mind-matters/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23654"
BASE_PATH = "/"
