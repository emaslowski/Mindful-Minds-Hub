kind = "web"
previewPath = "/"
title = "The Brightside Project"
description = "A student-created school community to learn, create, connect, and belong, with a connected Student Studio and teacher-reviewed publishing."
version = "1.0.0"
id = "artifacts/mind-matters"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23654

[services.development]
run = "pnpm --filter @workspace/mind-matters run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/mind-matters", "run", "build" ]
serve = "static"
publicDir = "artifacts/mind-matters/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23654"
BASE_PATH = "/"
