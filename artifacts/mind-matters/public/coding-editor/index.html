<!doctype html>
<!-- Mind Matters Scratch hosting integration: AGPL-3.0-or-later. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' blob: 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://assets.scratch.mit.edu; font-src 'self' data:; media-src 'self' data: blob: https://assets.scratch.mit.edu; connect-src 'self' https://assets.scratch.mit.edu; worker-src blob:; base-uri 'none'; form-action 'none'" />
    <title>Mind Matters coding editor</title>
    <style>
      html, body, #app { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body { font-family: Arial, sans-serif; }
      #loading { padding: 24px; color: #304e2d; }
      #error { margin: 24px; max-width: 600px; }
      /* This local-only classroom editor does not provide network/hardware extensions. */
      .blocklyExtensionButton,
      [class*="extension-button"],
      [class*="ExtensionButton"],
      [class*="extensionButton"],
      [aria-label="Add Extension"] { display: none !important; }
    </style>
  </head>
  <body>
    <div id="app"><p id="loading" role="status">Loading the block editor…</p></div>
    <script src="./editor.js"></script>
  </body>
</html>
