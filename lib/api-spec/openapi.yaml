          maxLength: 300
        description:
          type: string
          maxLength: 3000
        servings:
          type: string
          maxLength: 100
        prepTime:
          type: string
          maxLength: 100
        cookTime:
          type: string
          maxLength: 100
        ingredients:
          type: string
          maxLength: 20000
        steps:
          type: string
          maxLength: 30000
      required: [name, description, servings, prepTime, cookTime, ingredients, steps]
    PublicationBlock:
      type: object
      properties:
        id:
          type: string
          minLength: 1
          maxLength: 64
        type:
