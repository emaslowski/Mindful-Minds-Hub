    PublicationEdition:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 300
        content:
          type: string
          maxLength: 100000
        appearance:
          $ref: "#/components/schemas/PublicationAppearance"
        blocks:
          type: array
          maxItems: 40
          items:
            $ref: "#/components/schemas/PublicationBlock"
        pageOrder:
          type: number
          minimum: 0
          maximum: 10000
      required: [title, content, appearance]
    PublicationDraftInput:
      type: object
      properties:
        draft:
          $ref: "#/components/schemas/PublicationEdition"
        version:
          type: number
          minimum: 0
      required: [draft, version]
    PublicationDraftEnvelope:
      type: object
      properties:
        draft:
          $ref: "#/components/schemas/PublicationEdition"
        version:
          type: number
      required: [draft, version]

    # Public published content
    PublishedItem:
      type: object
      properties:
        id:
          type: number
        projectId:
          type: number
        title:
          type: string
        contentType:
          type: string
        content:
          type: string
        appearance:
          $ref: "#/components/schemas/PublicationAppearance"
        blocks:
          type: array
          items:
            $ref: "#/components/schemas/PublicationBlock"
        pageOrder:
          type: number
        destinationSection:
          type: string
        authorDisplay:
          type: string
        publishedAt:
          type: string
      required: [id, projectId, title, contentType, content, destinationSection, authorDisplay, publishedAt]
    PublishedContentEnvelope:
      type: object
      properties:
        publications:
          type: array
          items:
            $ref: "#/components/schemas/PublishedItem"
      required: [publications]
    ImpactStatsEnvelope:
      type: object
      properties:
        stats:
          type: object
          additionalProperties:
            type: number
      required: [stats]

    # Shared
    SubmissionResult:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required: [success, message]
