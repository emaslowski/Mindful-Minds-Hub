          enum: [text, image, video, audio, recipe]
        width:
          type: string
          enum: [full, half]
        text:
          type: string
          maxLength: 30000
        mediaId:
          type: number
          minimum: 1
        caption:
          type: string
          maxLength: 500
        alt:
          type: string
          maxLength: 300
        fit:
          type: string
