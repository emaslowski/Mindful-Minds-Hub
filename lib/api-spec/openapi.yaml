openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Mind Matters API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: blog
    description: Blog post operations
  - name: Auth
    description: Browser authentication endpoints
  - name: journal
    description: Personal journal and gratitude entries
  - name: collab
    description: Collaboration board
  - name: analytics
    description: Page view and section analytics
  - name: checkin
    description: Student mood check-in
  - name: reviews
    description: Site reviews
  - name: events
    description: Community events
  - name: friendship
    description: Opt-in friendship matches for enrolled students

paths:
  /plant-journal:
    get:
      operationId: getPlantJournal
      responses:
        "200":
          description: Private identity and saved observations, empty without individual access
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantJournal"
    post:
      operationId: createPlantObservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantObservationInput"
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantObservation"
  /plant-journal/{id}:
    put:
      operationId: updatePlantObservation
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: number }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantObservationInput"
      responses:
        "200":
          description: Updated own observation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantObservation"
  /athlete:
    get:
      operationId: listAthlete
      responses:
        "200":
          description: Approved Active Challenge gallery and Athlete of the Month
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AthleteGallery" }
  /athlete/mine:
    get:
      operationId: listMyAthlete
      responses:
        "200":
          description: Own Active Challenge submissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AthleteEntry" }
  /athlete/upload-url:
    post:
      operationId: requestAthleteUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AthleteUploadInput" }
      responses:
        "201":
          description: Private photo upload reserved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AthleteUpload" }
  /athlete/{id}/complete:
    post:
      operationId: completeAthlete
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Photo submitted for teacher review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AthleteEntry" }
  /athlete/{id}:
    delete:
      operationId: deleteAthlete
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "204": { description: Own photo withdrawn }
  /athlete/{id}/image:
    get:
      operationId: getAthleteImage
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Approved photo or authorized private preview
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /teacher/athlete:
    get:
      operationId: listTeacherAthlete
      responses:
        "200":
          description: Teacher Active Challenge photo review queue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AthleteEntry" }
  /teacher/athlete/{id}:
    patch:
      operationId: updateAthlete
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AthleteReviewInput" }
      responses:
        "200":
          description: Teacher review or monthly athlete updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AthleteEntry" }
  /artwork:
    get:
      operationId: listArtwork
      responses:
        "200":
          description: Approved gallery and current featured artist
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtworkGallery" }
  /artwork/mine:
    get:
      operationId: listMyArtwork
      responses:
        "200":
          description: Own submissions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArtworkEntry" }
  /artwork/upload-url:
    post:
      operationId: requestArtworkUpload
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArtworkUploadInput" }
      responses:
        "201":
          description: Private upload reserved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtworkUpload" }
  /artwork/{id}/complete:
    post:
      operationId: completeArtwork
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Submitted for review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtworkEntry" }
  /artwork/{id}:
    delete:
      operationId: deleteArtwork
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "204": { description: Submission withdrawn }
  /artwork/{id}/image:
    get:
      operationId: getArtworkImage
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Approved image or authorized private preview
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
  /teacher/artwork:
    get:
      operationId: listTeacherArtwork
      responses:
        "200":
          description: Teacher review queue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ArtworkEntry" }
  /teacher/artwork/{id}:
    patch:
      operationId: updateArtwork
      parameters:
        - { name: id, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ArtworkReviewInput" }
      responses:
        "200":
          description: Review or monthly winner updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ArtworkEntry" }
  /studio/video-productions:
    get:
      operationId: listVideoProductions
      responses:
        "200":
          description: Video production assignments
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoProductionsEnvelope"
  /studio/video-productions/{projectId}:
    get:
      operationId: getVideoProduction
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Video production, if assigned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoProductionEnvelope"
  /studio/video-productions/{projectId}/upload-url:
    post:
      operationId: requestVideoUpload
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoUploadInput"
      responses:
        "200":
          description: Private signed upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoUploadTicket"
  /studio/video-productions/{projectId}/complete:
    post:
      operationId: completeVideoUpload
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: number } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VideoCompletionInput"
      responses:
        "200":
          description: Uploaded video sent to teacher review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"
  /studio/video-productions/{projectId}/content:
    get:
      operationId: getPrivateProjectVideo
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: number } }
      responses:
        "200":
          description: Authorized video stream
          content:
            video/mp4:
              schema: { type: string, format: binary }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # Auth
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirect to returnTo path on success.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
            default: /
      responses:
        '302':
          description: Redirect to OIDC provider logout URL.

  # Blog
  /blog-posts:
    get:
      operationId: getBlogPosts
      tags: [blog]
      summary: Get all approved blog posts
      responses:
        "200":
          description: List of approved blog posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlogPost"
  /blog-posts/{id}:
    get:
      operationId: getBlogPost
      tags: [blog]
      summary: Get a single approved blog post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: A blog post
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BlogPost"
        "404":
          description: Not found
  /blog-submissions:
    post:
      operationId: submitBlogPost
      tags: [blog]
      summary: Submit a blog post for review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlogSubmissionInput"
      responses:
        "201":
          description: Submission received
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"
        "400":
          description: Invalid input

  # Journal (auth required)
  /journal-entries:
    get:
      operationId: getJournalEntries
      tags: [journal]
      summary: Get the current user's journal entries
      responses:
        "200":
          description: List of journal entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JournalEntry"
        "401":
          description: Unauthorized
    post:
      operationId: createJournalEntry
      tags: [journal]
      summary: Create a journal entry (flags concerning content)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JournalEntryInput"
      responses:
        "201":
          description: Journal entry saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntry"
        "401":
          description: Unauthorized

  # Gratitude journal (auth required)
  /gratitude-entries:
    get:
      operationId: getGratitudeEntries
      tags: [journal]
      summary: Get the current user's gratitude entries
      responses:
        "200":
          description: List of gratitude entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/GratitudeEntry"
        "401":
          description: Unauthorized
    post:
      operationId: createGratitudeEntry
      tags: [journal]
      summary: Add a gratitude entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GratitudeEntryInput"
      responses:
        "201":
          description: Gratitude entry saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GratitudeEntry"
        "401":
          description: Unauthorized

  # Today's prompt
  /today-prompt:
    get:
      operationId: getTodayPrompt
      tags: [journal]
      summary: Get today's writing prompt
      responses:
        "200":
          description: Today's prompt
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TodayPrompt"

  # Collaboration board (public)
  /collab-posts:
    get:
      operationId: getCollabPosts
      tags: [collab]
      summary: Get approved collaboration board posts
      responses:
        "200":
          description: List of collab posts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollabPost"
    post:
      operationId: submitCollabPost
      tags: [collab]
      summary: Submit a collab post for admin approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollabPostInput"
      responses:
        "201":
          description: Post submitted for review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"
        "400":
          description: Invalid input

  /collab-posts/{id}/comments:
    get:
      operationId: getCollabComments
      tags: [collab]
      summary: Get comments on a collab post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CollabComment"
    post:
      operationId: addCollabComment
      tags: [collab]
      summary: Add a comment to a collab post
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CollabCommentInput"
      responses:
        "201":
          description: Comment added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CollabComment"
        "400":
          description: Invalid input

  # Friendship profiles (enrolled students or active Journal accounts; teacher approval required)
  /friendship/profile:
    get:
      operationId: getFriendshipProfile
      tags: [friendship]
      summary: Get my opt-in friendship profile
      responses:
        "200":
          description: My friendship profile or an empty selection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendshipProfile"
        "401":
          description: Sign in required
        "403":
          description: Active enrolled student or Journal account required
    put:
      operationId: saveFriendshipProfile
      tags: [friendship]
      summary: Opt in or update my friendship profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendshipProfileInput"
      responses:
        "200":
          description: Saved profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendshipProfile"
        "400":
          description: Invalid selection
        "401":
          description: Sign in required
        "403":
          description: Active enrolled student or Journal account required
    delete:
      operationId: deleteFriendshipProfile
      tags: [friendship]
      summary: Leave friendship matching and remove my profile
      responses:
        "204":
          description: Profile removed
        "401":
          description: Sign in required
        "403":
          description: Active enrolled student or Journal account required

  /friendship/matches:
    get:
      operationId: getFriendshipMatches
      tags: [friendship]
      summary: Get similar teacher-approved students
      responses:
        "200":
          description: Matching students
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FriendshipMatch"
        "401":
          description: Sign in required
        "403":
          description: Active enrolled student or Journal account required

  /teacher/friendship/requests:
    get:
      operationId: getFriendshipJoinRequests
      tags: [friendship]
      summary: List pending friendship join requests for teachers
      responses:
        "200":
          description: Pending requests from active enrolled students and Journal accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FriendshipJoinRequest"
        "403":
          description: Teacher account required

  /teacher/friendship/requests/{userId}/decision:
    post:
      operationId: decideFriendshipJoinRequest
      tags: [friendship]
      summary: Approve or decline a student's friendship join request
      parameters:
        - in: path
          name: userId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FriendshipDecisionInput"
      responses:
        "200":
          description: Decision recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FriendshipDecisionResult"
        "400":
          description: Invalid decision
        "403":
          description: Teacher account required
        "409":
          description: Request is no longer pending or enrollment is inactive

  # Analytics
  /analytics/track:
    post:
      operationId: trackPageView
      tags: [analytics]
      summary: Track a page view or section click
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageViewInput"
      responses:
        "201":
          description: Tracked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"
  /analytics/summary:
    get:
      operationId: getAnalyticsSummary
      tags: [analytics]
      summary: Get analytics summary (total visits + top sections)
      responses:
        "200":
          description: Analytics summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalyticsSummary"

  # Check-in
  /checkin:
    post:
      operationId: submitCheckin
      tags: [checkin]
      summary: Submit a mood check-in and get section recommendations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CheckinInput"
      responses:
        "200":
          description: Recommendations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckinResult"

  # Reviews
  /reviews:
    get:
      operationId: getReviews
      tags: [reviews]
      summary: Get site reviews
      responses:
        "200":
          description: List of reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"
    post:
      operationId: submitReview
      tags: [reviews]
      summary: Submit a site review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Review submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "400":
          description: Invalid input

  # Events
  /events:
    get:
      operationId: getEvents
      tags: [events]
      summary: Get community events
      responses:
        "200":
          description: List of events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"

  /teacher/projects:
    post:
      operationId: createTeacherWebsiteProject
      tags: [teacher]
      summary: Create a website post directly as a teacher
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeacherWebsiteProjectInput"
      responses:
        "201":
          description: Website project created
        "400":
          description: Invalid post
        "403":
          description: Teacher access required

  /teacher/projects/{id}/publication-media:
    get:
      operationId: getTeacherPublicationMedia
      tags: [teacher]
      summary: List private project media for the website editor
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Project media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationMediaEnvelope"

  /teacher/projects/{id}/publication-media/upload-url:
    post:
      operationId: requestPublicationMediaUpload
      tags: [teacher]
      summary: Request a private image, video, or audio upload
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationMediaUploadInput"
      responses:
        "200":
          description: Signed upload destination
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationMediaUploadDestination"
        "400":
          description: Unsupported format or size

  /teacher/projects/{id}/publication-media/{mediaId}/complete:
    post:
      operationId: completePublicationMediaUpload
      tags: [teacher]
      summary: Verify the uploaded file before it can be used in a draft
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
        - name: mediaId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Verified media
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationMediaResult"
        "400":
          description: Missing, expired, or invalid uploaded file

  /teacher/projects/{id}/publication-media/import-video:
    post:
      operationId: importPublicationProductionVideo
      tags: [teacher]
      summary: Add the completed student video to the teacher media library
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Video available for the website edition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationMediaResult"
        "409":
          description: A finished production video is required

  /teacher/projects/{id}/publication-draft:
    patch:
      operationId: updateTeacherPublicationDraft
      tags: [teacher]
      summary: Save a teacher-only website draft without changing student work or the live edition
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PublicationDraftInput"
      responses:
        "200":
          description: Saved website draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicationDraftEnvelope"
        "400":
          description: Invalid draft
        "403":
          description: Teacher access required
        "404":
          description: Project not found
        "409":
          description: Another session changed this draft; refresh before overwriting it

  # Public published content (no auth required)
  /public/homepage-video:
    get:
      operationId: getHomepageVideo
      tags: [public]
      summary: Stream the teacher-selected homepage video
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [mp4, webm]
            default: mp4
      responses:
        "200":
          description: Homepage video
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
        "206":
          description: Partial video byte range
          content:
            video/mp4:
              schema:
                type: string
                format: binary
        "404":
          description: Homepage video is not available
        "400":
          description: Unsupported video format
        "416":
          description: Invalid byte range
  /public/featured-chef-video:
    get:
      operationId: getFeaturedChefVideo
      tags: [public]
      summary: Stream the teacher-selected Featured Chef video
      parameters:
        - name: format
          in: query
          required: false
          schema:
            type: string
            enum: [mp4, webm]
            default: mp4
      responses:
        "200":
          description: Featured Chef video
          content:
            video/mp4:
              schema:
                type: string
                format: binary
            video/webm:
              schema:
                type: string
                format: binary
        "206":
          description: Partial video byte range
        "404":
          description: Featured Chef video is not available
        "400":
          description: Unsupported video format
        "416":
          description: Invalid byte range
  /public/published:
    get:
      operationId: getPublishedContent
      tags: [public]
      summary: Get all active published student content
      description: Returns publications joined to projects where publication_status = active. Never includes student PII.
      parameters:
        - name: section
          in: query
          required: false
          schema:
            type: string
          description: Filter by destination_section (e.g. podcast, move, blog, meditation, wellness, recipe, events)
      responses:
        "200":
          description: Published content list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublishedContentEnvelope"

  /public/impact:
    get:
      operationId: getImpactStats
      tags: [public]
      summary: Get teacher-controlled public impact stats
      description: Returns only stats the teacher has toggled visible. Never requires auth.
      responses:
        "200":
          description: Impact statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImpactStatsEnvelope"

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      schema:
        type: string

  schemas:
    PlantJournal:
      type: object
      required: [ownerId, accessKind, entries]
      properties:
        ownerId: { type: [string, "null"] }
        accessKind: { type: [string, "null"], enum: [journal, individual, null] }
        entries:
          type: array
          items:
            $ref: "#/components/schemas/PlantObservation"
    PlantObservationInput:
      type: object
      additionalProperties: false
      required: [ownerId, date, nickname, heightCm, leafCount, observations]
      properties:
        ownerId: { type: string, minLength: 1 }
        date: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        nickname: { type: string, minLength: 1, maxLength: 80 }
        heightCm: { type: [number, "null"], minimum: 0, maximum: 100000 }
        leafCount: { type: [number, "null"], minimum: 0, maximum: 100000 }
        observations: { type: string, maxLength: 1000 }
    PlantObservation:
      type: object
      required: [id, date, nickname, heightCm, leafCount, observations]
      properties:
        id: { type: number }
        date: { type: string }
        nickname: { type: string }
        heightCm: { type: [number, "null"] }
        leafCount: { type: [number, "null"] }
        observations: { type: string }
    AthleteEntry:
      type: object
      required: [id, athleteName, title, status, featuredMonth, createdAt, imageUrl]
      properties:
        id: { type: number }
        athleteName: { type: string }
        title: { type: string }
        status: { type: string, enum: [uploading, pending, approved, rejected] }
        featuredMonth: { type: [string, "null"] }
        createdAt: { type: string }
        imageUrl: { type: string }
    AthleteGallery:
      type: object
      required: [athletes, featured, month]
      properties:
        athletes:
          type: array
          items: { $ref: "#/components/schemas/AthleteEntry" }
        featured:
          oneOf:
            - { $ref: "#/components/schemas/AthleteEntry" }
            - { type: "null" }
        month: { type: string }
    AthleteUploadInput:
      type: object
      additionalProperties: false
      required: [athleteName, title, filename, contentType, size, consent]
      properties:
        athleteName: { type: string, minLength: 1, maxLength: 40 }
        title: { type: string, minLength: 1, maxLength: 100 }
        filename: { type: string, minLength: 1, maxLength: 255 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: number, minimum: 1, maximum: 10485760 }
        consent: { type: boolean }
    AthleteUpload:
      type: object
      required: [id, uploadUrl]
      properties:
        id: { type: number }
        uploadUrl: { type: string }
    AthleteReviewInput:
      type: object
      additionalProperties: false
      properties:
        status: { type: string, enum: [approved, rejected] }
        featuredMonth: { type: [string, "null"] }
    ArtworkEntry:
      type: object
      required: [id, artistName, title, status, featuredMonth, createdAt, imageUrl]
      properties:
        id: { type: number }
        artistName: { type: string }
        title: { type: string }
        status: { type: string, enum: [uploading, pending, approved, rejected] }
        featuredMonth: { type: [string, "null"] }
        createdAt: { type: string }
        imageUrl: { type: string }
    ArtworkGallery:
      type: object
      required: [artworks, featured, month]
      properties:
        artworks:
          type: array
          items: { $ref: "#/components/schemas/ArtworkEntry" }
        featured:
          oneOf:
            - { $ref: "#/components/schemas/ArtworkEntry" }
            - { type: "null" }
        month: { type: string }
    ArtworkUploadInput:
      type: object
      required: [artistName, title, filename, contentType, size, consent]
      properties:
        artistName: { type: string, minLength: 1, maxLength: 40 }
        title: { type: string, minLength: 1, maxLength: 100 }
        filename: { type: string, minLength: 1, maxLength: 255 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        size: { type: number, minimum: 1, maximum: 10485760 }
        consent: { type: boolean }
    ArtworkUpload:
      type: object
      required: [id, uploadUrl]
      properties:
        id: { type: number }
        uploadUrl: { type: string }
    ArtworkReviewInput:
      type: object
      properties:
        status: { type: string, enum: [approved, rejected] }
        featuredMonth: { type: [string, "null"] }
    VideoProduction:
      type: object
      required: [projectId, projectTitle, contentType, content, projectStatus, status, instructions, filename, uploadedAt, videoUrl, createdAt]
      properties:
        projectId: { type: number }
        projectTitle: { type: string }
        contentType: { type: string }
        content: { type: string }
        projectStatus: { type: string }
        status: { type: string, enum: [assigned, uploaded] }
        instructions: { type: string }
        filename: { type: [string, "null"] }
        uploadedAt: { type: [string, "null"] }
        videoUrl: { type: [string, "null"] }
        createdAt: { type: string }
    VideoProductionsEnvelope:
      type: object
      required: [productions]
      properties:
        productions:
          type: array
          items:
            $ref: "#/components/schemas/VideoProduction"
    VideoProductionEnvelope:
      type: object
      required: [production]
      properties:
        production:
          oneOf:
            - $ref: "#/components/schemas/VideoProduction"
            - type: "null"
    VideoUploadInput:
      type: object
      required: [filename, contentType, size]
      properties:
        filename: { type: string, minLength: 1, maxLength: 200 }
        contentType: { type: string, enum: [video/mp4, video/webm, video/quicktime, video/ogg] }
        size: { type: number, minimum: 1, maximum: 262144000 }
    VideoUploadTicket:
      type: object
      required: [uploadUrl, objectPath]
      properties:
        uploadUrl: { type: string }
        objectPath: { type: string }
    VideoCompletionInput:
      type: object
      required: [objectPath]
      properties:
        objectPath: { type: string, minLength: 1 }
    FriendshipProfileInput:
      type: object
      required: [firstName, lastInitial, interests, qualities]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 30
        lastInitial:
          type: string
          minLength: 1
          maxLength: 1
        interests:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            enum: [Art, Books, Cooking, Gardening, Games, Music, Nature, Sports]
        qualities:
          type: array
          minItems: 1
          maxItems: 4
          uniqueItems: true
          items:
            type: string
            enum: [Creative, Curious, Kind, Playful, Thoughtful, Adventurous]
    FriendshipProfile:
      type: object
      required: [optedIn, approvalStatus, firstName, lastInitial, interests, qualities]
      properties:
        optedIn:
          type: boolean
        approvalStatus:
          type: string
          enum: [none, pending, approved, rejected]
        firstName:
          type: ["string", "null"]
        lastInitial:
          type: ["string", "null"]
        interests:
          type: array
          items:
            type: string
        qualities:
          type: array
          items:
            type: string
    FriendshipMatch:
      type: object
      required: [displayName, sharedInterests, sharedQualities]
      properties:
        displayName:
          type: string
        sharedInterests:
          type: array
          items:
            type: string
        sharedQualities:
          type: array
          items:
            type: string
    FriendshipJoinRequest:
      type: object
      required: [userId, displayName, matchName, interests, qualities, requestedAt]
      properties:
        userId:
          type: string
        displayName:
          type: string
        matchName:
          type: ["string", "null"]
        interests:
          type: array
          items:
            type: string
        qualities:
          type: array
          items:
            type: string
        requestedAt:
          type: string
    FriendshipDecisionInput:
      type: object
      required: [decision]
      properties:
        decision:
          type: string
          enum: [approve, reject]
    FriendshipDecisionResult:
      type: object
      required: [approvalStatus]
      properties:
        approvalStatus:
          type: string
          enum: [approved, rejected]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required: [status]

    # Auth
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl, role]
      properties:
        id:
          type: string
        email:
          type: ["string", "null"]
        firstName:
          type: ["string", "null"]
        lastName:
          type: ["string", "null"]
        profileImageUrl:
          type: ["string", "null"]
        displayName:
          type: ["string", "null"]
        role:
          type: string
          enum: [teacher, student, none]
        accountType:
          type: string
          enum: [primary, journal]
        journalAccountActive:
          type: boolean
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    # Blog
    BlogPost:
      type: object
      properties:
        id:
          type: number
        title:
          type: string
        author:
          type: string
        content:
          type: string
        excerpt:
          type: string
        submittedAt:
          type: string
        approvedAt:
          type: ["string", "null"]
      required: [id, title, author, content, excerpt, submittedAt, approvedAt]
    BlogSubmissionInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        author:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 10
      required: [title, author, content]

    # Journal
    JournalEntry:
      type: object
      properties:
        id:
          type: number
        prompt:
          type: string
        content:
          type: string
        flagged:
          type: boolean
        createdAt:
          type: string
      required: [id, prompt, content, flagged, createdAt]
    JournalEntryInput:
      type: object
      properties:
        prompt:
          type: string
        content:
          type: string
          minLength: 1
      required: [content]

    # Gratitude
    GratitudeEntry:
      type: object
      properties:
        id:
          type: number
        content:
          type: string
        entryDate:
          type: string
        createdAt:
          type: string
      required: [id, content, entryDate, createdAt]
    GratitudeEntryInput:
      type: object
      properties:
        content:
          type: string
          minLength: 1
      required: [content]

    # Today's prompt
    TodayPrompt:
      type: object
      properties:
        prompt:
          type: string
        date:
          type: string
      required: [prompt, date]

    # Collab board
    CollabPost:
      type: object
      properties:
        id:
          type: number
        authorName:
          type: string
        content:
          type: string
        commentCount:
          type: number
        createdAt:
          type: string
      required: [id, authorName, content, commentCount, createdAt]
    CollabPostInput:
      type: object
      properties:
        authorName:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 5
      required: [authorName, content]
    CollabComment:
      type: object
      properties:
        id:
          type: number
        authorName:
          type: string
        content:
          type: string
        createdAt:
          type: string
      required: [id, authorName, content, createdAt]
    CollabCommentInput:
      type: object
      properties:
        authorName:
          type: string
          minLength: 1
        content:
          type: string
          minLength: 1
      required: [authorName, content]

    # Analytics
    PageViewInput:
      type: object
      properties:
        path:
          type: string
        section:
          type: ["string", "null"]
      required: [path]
    AnalyticsSummary:
      type: object
      properties:
        totalVisits:
          type: number
        topSections:
          type: array
          items:
            $ref: "#/components/schemas/SectionStat"
        recentDailyVisits:
          type: array
          items:
            $ref: "#/components/schemas/DailyStat"
      required: [totalVisits, topSections, recentDailyVisits]
    SectionStat:
      type: object
      properties:
        section:
          type: string
        count:
          type: number
      required: [section, count]
    DailyStat:
      type: object
      properties:
        date:
          type: string
        count:
          type: number
      required: [date, count]

    # Check-in
    CheckinInput:
      type: object
      properties:
        mood:
          type: string
        challenges:
          type: array
          items:
            type: string
      required: [mood]
    CheckinResult:
      type: object
      properties:
        message:
          type: string
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/SectionRecommendation"
      required: [message, recommendations]
    SectionRecommendation:
      type: object
      properties:
        section:
          type: string
        path:
          type: string
        reason:
          type: string
      required: [section, path, reason]

    # Reviews
    Review:
      type: object
      properties:
        id:
          type: number
        rating:
          type: number
        helpful:
          type: boolean
        comment:
          type: ["string", "null"]
        createdAt:
          type: string
      required: [id, rating, helpful, createdAt]
    ReviewInput:
      type: object
      properties:
        rating:
          type: number
        helpful:
          type: boolean
        comment:
          type: ["string", "null"]
